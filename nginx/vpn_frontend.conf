server {
    listen 127.0.0.1:4443 ssl http2 default_server;
    listen [::1]:4443 ssl http2 default_server;
    server_name chkdarkmaster.duckdns.org _;

    ssl_certificate     /etc/ssl/localcerts/chkdarkmaster.duckdns.org.pem;
    ssl_certificate_key /etc/ssl/localcerts/chkdarkmaster.duckdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
            alias /var/www/vpn-panel/index.html;
    }

    location = /saeka-vless-xh {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

        location ^~ /admin/ {
            alias /var/www/vpn-panel/;
        }
    location = /saeka-vless-ws {
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /saeka-vless-grpc {
        grpc_pass grpc://127.0.0.1:10003;
        grpc_set_header Host $host;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location = /saeka-vmess-ws {
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /saeka-trojan-ws {
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- WebSocket upgrade -> SSH bridge (checked directly, no map) ---
    location = / {
        if ($http_upgrade ~* "websocket") {
            return 418;
        }
        root /var/www/vpn-panel;
        try_files /portal.html /index.html =404;
    }

    error_page 418 = @ws_bridge;

    location @ws_bridge {
        proxy_pass http://127.0.0.1:9998;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /status {
        default_type application/json;
        return 200 '{"status":"ok","service":"vpn-frontend"}\n';
    }

    location = /healthz {
        default_type text/plain;
        return 200 'healthy\n';
    }

    location / {
        root /var/www/vpn-panel;
        try_files $uri $uri/ /portal.html =404;
    }
}

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name chkdarkmaster.duckdns.org _;
    return 301 https://$host$request_uri;
}
